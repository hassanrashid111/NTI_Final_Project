<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FavraAI — Enterprise Retail Intelligence Platform. AI-powered demand forecasting and inventory optimization for 54+ retail stores." />
  <title>FavraAI — Enterprise Retail Intelligence Platform</title>

  <!-- Tailwind CSS CDN Config -->
  <script>
    window.tailwind = { config: { darkMode: 'class', theme: { extend: {} } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-100 flex min-h-screen">

  <!-- ═══════════════════════════════════════════════════════
       SIDEBAR — Clean, Minimal, Professional
       ═══════════════════════════════════════════════════════ -->
  <aside id="app-sidebar" class="w-[260px] bg-slate-900/95 backdrop-blur-xl border-r border-zinc-800/60 flex flex-col justify-between shrink-0 h-screen sticky top-0 animate-slide-left">
    <div>
      <!-- Brand Header -->
      <div class="px-5 py-5 border-b border-zinc-800/50">
        <div class="flex items-center gap-3">
          <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-emerald-500 to-sky-500 rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-300"></div>
            <img src="assets/images/logo.png" alt="FavraAI Logo" class="relative w-10 h-10 object-contain rounded-xl border border-emerald-500/30 p-1 bg-slate-900/90 shadow-lg shadow-emerald-950/50 transition-transform duration-300 group-hover:scale-105" />
          </div>
          <div>
            <h1 class="font-extrabold text-[1.1rem] tracking-tight brand-gradient leading-tight">FavraAI</h1>
            <p class="text-[9px] text-zinc-400 uppercase tracking-[0.14em] font-semibold">Retail Intelligence</p>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="px-3 py-4">
        <!-- Main Section -->
        <p class="px-3 mb-2 text-[9px] font-semibold uppercase tracking-[0.12em] text-zinc-600">Main</p>
        <div class="space-y-0.5">
          <a href="#dashboard" class="nav-link active" data-tooltip="Overview of KPIs, charts & alerts">
            <span class="nav-icon"><i data-lucide="layout-dashboard" class="w-[17px] h-[17px]"></i></span>
            <span>Dashboard</span>
          </a>
          <a href="#upload" class="nav-link" data-tooltip="Upload CSV or load sample datasets">
            <span class="nav-icon"><i data-lucide="upload-cloud" class="w-[17px] h-[17px]"></i></span>
            <span>Data Upload</span>
          </a>
          <a href="#forecast" class="nav-link" data-tooltip="16-day demand predictions">
            <span class="nav-icon"><i data-lucide="activity" class="w-[17px] h-[17px]"></i></span>
            <span>Forecast Engine</span>
          </a>
          <a href="#inventory" class="nav-link" data-tooltip="SS, ROP, TSL, ROQ table">
            <span class="nav-icon"><i data-lucide="package" class="w-[17px] h-[17px]"></i></span>
            <span>Inventory</span>
          </a>
          <a href="#alerts" class="nav-link" data-tooltip="Critical understock procurement alerts">
            <span class="nav-icon"><i data-lucide="alert-triangle" class="w-[17px] h-[17px]"></i></span>
            <span>Risk Alerts</span>
            <span class="nav-badge">63K</span>
          </a>
        </div>

        <!-- Analytics Section -->
        <p class="px-3 mt-5 mb-2 text-[9px] font-semibold uppercase tracking-[0.12em] text-zinc-600">Analytics</p>
        <div class="space-y-0.5">
          <a href="#stores" class="nav-link" data-tooltip="Store network performance comparison">
            <span class="nav-icon"><i data-lucide="store" class="w-[17px] h-[17px]"></i></span>
            <span>Stores</span>
          </a>
          <a href="#analytics" class="nav-link" data-tooltip="Category-level demand analysis">
            <span class="nav-icon"><i data-lucide="trending-up" class="w-[17px] h-[17px]"></i></span>
            <span>Categories</span>
          </a>
          <a href="#model" class="nav-link" data-tooltip="Model benchmarks & hardware specs">
            <span class="nav-icon"><i data-lucide="cpu" class="w-[17px] h-[17px]"></i></span>
            <span>Model & GPU</span>
          </a>
        </div>

        <!-- System Section -->
        <p class="px-3 mt-5 mb-2 text-[9px] font-semibold uppercase tracking-[0.12em] text-zinc-600">System</p>
        <div class="space-y-0.5">
          <a href="#guide" class="nav-link" data-tooltip="Learn how FavraAI works">
            <span class="nav-icon"><i data-lucide="book-open" class="w-[17px] h-[17px]"></i></span>
            <span>Guide</span>
          </a>
          <a href="#settings" class="nav-link" data-tooltip="Configure OR thresholds">
            <span class="nav-icon"><i data-lucide="settings" class="w-[17px] h-[17px]"></i></span>
            <span>Settings</span>
          </a>
        </div>
      </nav>
    </div>

    <!-- Sidebar Footer -->
    <div class="px-4 py-4 border-t border-zinc-800/50 bg-zinc-900/30">
      <!-- Engine Status -->
      <div class="flex items-center gap-2 mb-3">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[10px] text-emerald-400/80 font-medium">LightGBM GPU Ready</span>
      </div>
      <!-- Hardware -->
      <div class="flex items-center gap-2 text-[10px] text-zinc-600">
        <i data-lucide="monitor" class="w-3 h-3"></i>
        <span>RTX 4050 · 125M Rows · Offline</span>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════════
       MAIN APPLICATION WRAPPER
       ═══════════════════════════════════════════════════════ -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- ═══════════════ TOP NAVBAR — Executive SaaS Design ═══════════════ -->
    <header class="h-16 border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur-2xl px-6 flex items-center justify-between sticky top-0 z-30 animate-fadein-d1">
      <!-- Left: Status Badges -->
      <div class="flex items-center gap-3">
        <div id="system-status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 shadow-sm">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-xs text-emerald-400 font-semibold tracking-tight">FastAPI GPU Connected</span>
        </div>
        <span class="text-zinc-700 hidden sm:inline">|</span>
        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900/80 border border-zinc-800/60 text-xs text-zinc-400 font-mono">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>Aug 01 → Aug 16, 2017 (16 Days)</span>
        </div>
      </div>

      <!-- Center: Universal Search Bar -->
      <div class="flex-1 max-w-md mx-6 hidden md:block">
        <div class="relative group">
          <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 group-hover:text-emerald-400 transition-colors"></i>
          <input type="text" placeholder="Search Store # (1-54), SKU, or Product Category..."
                 class="w-full bg-zinc-900/90 border border-zinc-800/80 rounded-xl pl-10 pr-12 py-2 text-xs text-zinc-200 placeholder:text-zinc-500 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/10 transition-all shadow-inner" />
          <kbd class="absolute right-3 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-[10px] font-mono text-zinc-500 bg-zinc-800/80 border border-zinc-700/60 rounded">⌘K</kbd>
        </div>
      </div>

      <!-- Right: Notification & Actions & User Profile -->
      <div class="flex items-center gap-3">
        <!-- Quick Alert Queue Bell -->
        <a href="#alerts" class="relative p-2 rounded-xl bg-zinc-900/80 border border-zinc-800/60 text-zinc-400 hover:text-white hover:border-zinc-700 transition-all group" data-tooltip="Procurement Risk Alerts Queue">
          <i data-lucide="bell" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full animate-ping"></span>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
        </a>

        <!-- Run Inference Button -->
        <button onclick="checkHealth()" class="btn btn-primary flex items-center gap-2 py-2 px-4 text-xs font-semibold rounded-xl shadow-lg shadow-emerald-950/40" data-tooltip="Check system health & execute model inference">
          <i data-lucide="zap" class="w-3.5 h-3.5"></i>
          <span>Run Inference</span>
        </button>

        <!-- User Profile Avatar -->
        <div class="flex items-center gap-2 pl-2 border-l border-zinc-800/80">
          <div class="relative">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-sky-500 p-0.5 shadow-md">
              <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center font-extrabold text-xs text-emerald-400">
                FA
              </div>
            </div>
            <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-zinc-950 rounded-full"></span>
          </div>
        </div>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto min-h-0">
      <!-- Pages rendered dynamically by assets/js/app.js -->
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- App Script -->
  <script src="assets/js/app.js"></script>
</body>
</html>
